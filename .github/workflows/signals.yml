# Moteur unique : tests (push/PR) + live toutes les 15 min (schedule).
# Repo PUBLIC recommandé : minutes Actions illimitées + page statut publique.
# Secrets requis : TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
# Pages : Settings → Pages → Deploy from branch → main → /docs.
name: Signaux Deriv

on:
  schedule:
    - cron: "*/15 * * * *" # synthétiques 24/7 : pas de pause week-end
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/run_all_tests.py

  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: { group: deriv-live, cancel-in-progress: false }
    permissions:
      contents: write # commit data/signals.db + docs/index.html
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Cache Deriv (bougies/ticks — perf uniquement, perte sans gravité)
        uses: actions/cache@v4
        with:
          path: data/cache
          key: deriv-cache-${{ github.run_id }}
          restore-keys: deriv-cache-
      # C1 — synchroniser l'état AVANT analyse : un run retry/attente part d'un
      # SHA figé à sa création ; sans sync il rejouerait (et renotifierait) des
      # signaux déjà traités. Échec ici = arrêt AVANT toute notification.
      - name: Synchroniser l'état (anti-doublon inter-runs)
        run: |
          git fetch origin main
          git merge --ff-only origin/main || \
            (echo "❌ base divergente : arrêt avant analyse (0 notification)" && exit 1)
      - name: Cycle live + Telegram
        run: python scripts/live_once.py --db data/signals.db
      - name: Page statut
        if: always()
        run: python scripts/make_status.py --db data/signals.db --out docs/index.html
      # C1 — commit même sur run rouge (flags notified_* persistés) + push réessayé :
      # sans ceci, notify-puis-rollback ⇒ renotification au run suivant.
      - name: Commit état + statut
        if: always()
        run: |
          git config user.name "deriv-bot"
          git config user.email "deriv-bot@users.noreply.github.com"
          git add data/signals.db docs/index.html data/paper.db
          git diff --cached --quiet && echo "rien à committer" && exit 0
          git commit -m "🤖 live : $(date -u '+%d/%m %H:%M UTC')"
          ok=0
          for i in 1 2 3; do
            git pull --rebase && git push && ok=1 && break
            echo "⚠️ push tentative $i échouée, nouvel essai..."
            sleep 5
          done
          [ "$ok" = "1" ] || (echo "❌ push impossible après 3 essais" && exit 1)
